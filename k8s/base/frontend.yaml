apiVersion: apps/v1
kind: Deployment
metadata:
  name: qit-frontend
  labels:
    app: qit-frontend
    app.kubernetes.io/part-of: qit
spec:
  # replicas managed by HPA (hpa.yaml)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: qit-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: qit-frontend
    spec:
      # imagePullSecrets:
      #   - name: dockerhub-cred
      containers:
        - name: frontend
          image: qit-frontend   # tag set per environment in overlays/*/kustomization.yaml
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://qit-backend:8000
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: qit-frontend
  labels:
    app: qit-frontend
    app.kubernetes.io/part-of: qit
spec:
  type: NodePort
  selector:
    app: qit-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
