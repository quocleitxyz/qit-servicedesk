# Template only. Create the real secrets with kubectl (see README) - never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: qit-db-secret
  namespace: qit-prod            # qit-dev / qit-staging / qit-prod
type: Opaque
stringData:
  DB_USER: qit_prod_user         # qit_dev_user / qit_staging_user / qit_prod_user
  DB_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: qit-backend-secret
  namespace: qit-prod
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string
  ADMIN_EMAIL: admin@example.com     # first administrator, created at startup if missing
  ADMIN_PASSWORD: change-me
