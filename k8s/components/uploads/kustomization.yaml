# Mounts the knowledge base file storage into the backend at /data/uploads.
# An overlay that uses this component must also provide the PVC "qit-uploads-pvc" (its storage.yaml).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: qit-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: qit-backend
      spec:
        template:
          spec:
            initContainers:
              # A new volume belongs to root; the backend runs as uid 10001, so hand it the folder.
              - name: uploads-permissions
                image: busybox:1.36
                command: ["sh", "-c", "chown 10001:10001 /data/uploads && chmod 750 /data/uploads"]
                securityContext:
                  runAsUser: 0
                  runAsNonRoot: false
                  allowPrivilegeEscalation: false
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    cpu: 50m
                    memory: 32Mi
                volumeMounts:
                  - name: uploads
                    mountPath: /data/uploads
            containers:
              - name: backend
                volumeMounts:
                  - name: uploads
                    mountPath: /data/uploads
            volumes:
              - name: uploads
                persistentVolumeClaim:
                  claimName: qit-uploads-pvc
