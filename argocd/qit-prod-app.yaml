# Argo CD application for QIT-PROD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qit-prod-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/quocleitxyz/qit-servicedesk.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: qit-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
